<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumping Game | Mayerfeld JS2</title>
    <link rel="stylesheet" href="style.css" />

    <script src="JS/shared.js" defer></script>
    <script src="JS/player.js" defer></script>
    <script src="JS/obstacles.js" defer></script>
    <script src="JS/game.js" defer></script>
  </head>
  <body>
    <main class="game-page">
    <h1>Jumping Game</h1>

    <p id="game-instructions">
        Press Start, then use Space to jump over obstacles.
        Each obstacle passed earns one point.
    </p>

    <section class="game-panel" aria-labelledby="game-heading">
        <h2 id="game-heading">Play area</h2>

        <p class="score-label">
            Score:
            <output id="score" aria-label="Score">0</output>
        </p>

        <div id="game-area">
            <!-- Aspa: character -->
            <div id="player" aria-hidden="true"></div>

            <!-- Betim: obstacles -->
            <div id="obstacles" aria-hidden="true"></div>
        </div>

        <!-- Tahlia: messages and controls -->
        <p id="game-message" role="status">
            Game setup in progress.
        </p>

        <div class="game-controls">
            <button id="start-button" type="button" disabled>
                Start
            </button>

            <button id="restart-button" type="button" hidden>
                Restart
            </button>
        </div>
    </section>
</main>
  </body>
</html>
